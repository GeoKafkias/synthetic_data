[project]
name = "synthetic-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["adalflow>=1.0.4", "google-genai>=1.4.0", "polars>=1.24.0"]

[tool.ruff]
exclude = [".venv"]
src = ["src"]
target-version = "py312"
unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
quote-style = "double"
